name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Jobs are added phase-by-phase as their prerequisites land:
#   - Phase 1 added `verify-maths` (needs src/lib/transformer/* and fixtures).
#   - Phase 2 added `e2e-tests` (needs Drizzle schema + auth + a home page).
#   - Phase 11 added `lighthouse` (Lighthouse CI: performance, accessibility
#     and best practices must each score >= 90; see lighthouserc.json).
#   - Brief 29A added `training-reference` (the Part 2 trainer's PyTorch
#     checks and fixtures) and `cit-concept-audit`.

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  verify-maths:
    name: Verify maths against PyTorch fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:maths

  training-reference:
    name: Training reference (PyTorch checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # CPU-only PyTorch, pinned: the gradient checks compare the hand-written
      # backward pass with torch.autograd, the optimisers with torch.optim.
      - run: pip install -r scripts/training/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      # Recomputes every training fixture, results.json/results.md and the
      # default run's weights, and fails on a failed check or a difference.
      - run: python scripts/training/make_fixtures.py --check

  cit-concept-audit:
    name: CiT concept audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Every training concept the Compute in Transit results site relies
      # on must be explained by a shipped Training chapter (offline: the term
      # list is committed; chapters not shipped yet are reported as pending).
      - run: python scripts/cit_concept_audit.py

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: transformer_explainer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/transformer_explainer_test
      AUTH_SECRET: test-secret-do-not-use-in-production-test-secret
      AUTH_GITHUB_ID: test
      AUTH_GITHUB_SECRET: test
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ADMIN_GITHUB_LOGINS: testadmin
      MAX_SEQ_LEN: 16
      MAX_D_MODEL: 64
      MAX_BLOCKS: 4
      E2E_TEST_AUTH: "true"
      # Auth.js v5 rejects unknown hosts in production builds; the e2e build
      # uses `pnpm build && pnpm start` and therefore must opt in.
      AUTH_TRUST_HOST: "true"
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm test:e2e:install
      - run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: transformer_explainer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # Production-like: no E2E credentials provider, real `pnpm build`.
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/transformer_explainer_test
      AUTH_SECRET: test-secret-do-not-use-in-production-test-secret
      AUTH_GITHUB_ID: test
      AUTH_GITHUB_SECRET: test
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ADMIN_GITHUB_LOGINS: testadmin
      AUTH_TRUST_HOST: "true"
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm build
      # Starts `pnpm start`, audits `/`, `/learn` and `/learn/03-attention`
      # three times each, and fails on any category below 0.9.
      - run: pnpm lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 7
